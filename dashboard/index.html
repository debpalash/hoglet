<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hoglet</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a31;
    --fg: #e6edf3; --dim: #8b98a5; --accent: #ffb454; --good: #3fb950;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .hog { font-size: 22px; }
  header .tag { color: var(--dim); font-size: 12px; }
  header input {
    margin-left: auto; background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 6px 10px; border-radius: 6px; font: inherit;
  }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px;
  }
  .card .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 34px; font-weight: 700; margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  @media (max-width: 800px) { .cards, .grid2 { grid-template-columns: 1fr; } }
  section.panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; min-height: 200px;
  }
  section.panel h2 { font-size: 13px; color: var(--dim); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row .n { color: var(--accent); }
  .ev { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .ev .name { color: var(--good); }
  .ev .did { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .ts { color: var(--dim); margin-left: auto; white-space: nowrap; }
  .empty { color: var(--dim); font-size: 13px; }
  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 24px; }
</style>
</head>
<body>
<header>
  <span class="hog">🦔</span>
  <h1>Hoglet</h1>
  <span class="tag">PostHog-compatible · one binary</span>
  <input id="token" value="phc_demo" spellcheck="false" />
</header>
<main>
  <div class="cards">
    <div class="card"><div class="label">Total events</div><div class="value" id="total">–</div></div>
    <div class="card"><div class="label">Unique persons</div><div class="value" id="persons">–</div></div>
    <div class="card"><div class="label">Last 24h</div><div class="value" id="last24">–</div></div>
  </div>
  <div class="grid2">
    <section class="panel">
      <h2>Top events</h2>
      <div id="top"><div class="empty">No events yet.</div></div>
    </section>
    <section class="panel">
      <h2>Live stream</h2>
      <div id="live"><div class="empty">Waiting for events…</div></div>
    </section>
  </div>
</main>
<footer>Hoglet · numbers you can trust</footer>
<script>
const $ = (id) => document.getElementById(id);
const token = () => encodeURIComponent($("token").value.trim() || "phc_demo");

async function j(url) {
  try { const r = await fetch(url); if (!r.ok) return null; return await r.json(); }
  catch { return null; }
}

async function refresh() {
  const s = await j(`/api/stats?token=${token()}`);
  if (s) {
    $("total").textContent = s.total_events.toLocaleString();
    $("persons").textContent = s.unique_persons.toLocaleString();
    $("last24").textContent = s.events_24h.toLocaleString();
  }
  const top = await j(`/api/top_events?token=${token()}&limit=8`);
  if (top) {
    $("top").innerHTML = top.length
      ? top.map(t => `<div class="row"><span>${esc(t.event)}</span><span class="n">${t.count.toLocaleString()}</span></div>`).join("")
      : `<div class="empty">No events yet.</div>`;
  }
  const live = await j(`/api/recent?token=${token()}&limit=25`);
  if (live) {
    $("live").innerHTML = live.length
      ? live.map(e => `<div class="ev"><span class="name">${esc(e.event)}</span><span class="did">${esc(e.distinct_id)}</span><span class="ts">${esc(e.timestamp.slice(11,19))}</span></div>`).join("")
      : `<div class="empty">Waiting for events…</div>`;
  }
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
